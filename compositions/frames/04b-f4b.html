        }

        <div class="bubble-field" id="f4b-bubbles"></div>
        <div class="f4b-jelly" style="left: 1280px; top: 700px;"><div class="dome"></div><i></i><i></i><i></i></div>

        <div class="halftone"></div>
        <div class="grain"></div>

        <div class="f4b-cover" id="f4b-cover"></div>

      <script src="../../assets/hf.js"></script>
      <script>
        HF.frame("04b-f4b", function (tl, root) {
          tl.fromTo("#f4b-cover", { scale: 1 }, { scale: 0, duration: .40, ease: "power3.out" }, 0);
          HF.plate(tl, "#f4b-plate img", { s0: 1.06, s1: 1.13, x0: 10, x1: -34, y0: 0, y1: 16, dur: 7.27, at: 0 });
          HF.bubbles(tl, root, { count: 14, dur: 6.4, min: 8, max: 38, spread: 4.8, opacity: .7, z: 10 });

          tl.fromTo("#f4b-deep", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: .42, ease: "power3.out" }, .05);
          HF.stamp(tl, "#f4b-strip", 1.43, { rot: -2, dur: .40 });
          HF.stamp(tl, "#f4b-just1", 3.42, { rot: -3, dur: .38 });
          HF.stamp(tl, "#f4b-just2", 4.83, { rot: 2.4, dur: .38 });
          HF.reveal(tl, "#f4b-depth", .75, { y: 10, dur: .5 });

          HF.all(".f4b-jelly").forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, y: 20, scale: .8 }, { opacity: .8, y: 0, scale: 1, duration: 1.0, ease: "sine.out" }, .3 + i * .35);
            tl.to(el, { y: -50 - i * 12, x: (i % 2 ? 20 : -16), rotation: (i % 2 ? 4 : -3), duration: 5.2, ease: "sine.inOut" }, .9 + i * .35);
          });

          [3.42, 4.83].forEach(function (t) {
            tl.to("#f4b-plate img", { scale: 1.11, duration: .12, ease: "power2.out" }, t);
            tl.to("#f4b-plate img", { scale: 1.13, duration: .35, ease: "sine.in" }, t + .12);
          });

          tl.fromTo("#f4b-iris", { scale: 0 }, { scale: 1, duration: .72, ease: "power3.in" }, 6.42);
        });
      </script>
    </template>
  </body>
