<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>07 — Parmesan</title></head>
  <body>
    <template>
      <link rel="stylesheet" href="../../assets/fonts.css" />
      <link rel="stylesheet" href="../../assets/base.css" />
      <style>
        [data-composition-id="07-f7"] { background: var(--mustard); }
        [data-composition-id="07-f7"] .f7-cover {
          position: absolute; left: 50%; top: 50%; width: 2800px; height: 2800px;
          margin: -1400px 0 0 -1400px; border-radius: 50%; background: var(--mustard);
          z-index: 96; transform: scale(1);
        }
        [data-composition-id="07-f7"] .f7-cloud {
          position: absolute; inset: 0; z-index: 40; opacity: 0; pointer-events: none;
          background: radial-gradient(circle at 52% 58%, rgba(255,248,232,1) 0%, rgba(247,238,218,.98) 48%, rgba(247,238,218,.9) 100%);
        }
        [data-composition-id="07-f7"] .f7-title {
          position: absolute; left: 420px; top: 66px; z-index: 26; width: 760px;
        }
        [data-composition-id="07-f7"] .f7-kicker {
          display: flex; align-items: center; gap: 16px; color: var(--red); margin-bottom: 12px;
        }
        [data-composition-id="07-f7"] .f7-kicker .line { height: 3px; width: 120px; background: var(--red); }
        [data-composition-id="07-f7"] .f7-parm {
          font-size: 142px; color: var(--ink);
          text-shadow: 7px 7px 0 var(--mustard), 12px 12px 0 rgba(22,23,42,.2);
          line-height: .82; opacity: 0;
        }
        [data-composition-id="07-f7"] .f7-crispy {
          font-size: 82px; color: var(--red); line-height: .9; margin-top: 8px;
          text-shadow: 4px 4px 0 rgba(22,23,42,.18); opacity: 0;
        }
        [data-composition-id="07-f7"] .f7-snowtag {
          position: absolute; right: 96px; top: 92px; z-index: 25; text-align: right;
          color: var(--ink); opacity: 0;
        }
        [data-composition-id="07-f7"] .f7-snowtag .mono { font-size: 12px; color: rgba(22,23,42,.65); margin-top: 5px; }
        [data-composition-id="07-f7"] .f7-flake {
          position: absolute; z-index: 18; background: var(--cream);
          border: 1.5px solid rgba(22,23,42,.2); box-shadow: 1px 2px 0 rgba(22,23,42,.12);
          will-change: transform;
        }
        [data-composition-id="07-f7"] .f7-stamp1 {
          position: absolute; left: 88px; bottom: 148px; z-index: 28;
        }
        [data-composition-id="07-f7"] .f7-stamp2 {
          position: absolute; left: 470px; bottom: 68px; z-index: 28;
        }
        [data-composition-id="07-f7"] .f7-stamp1 .stamp, [data-composition-id="07-f7"] .f7-stamp2 .stamp {
          font-size: 74px; padding: 20px 30px 16px; letter-spacing: .12em;
        }
        [data-composition-id="07-f7"] .f7-grate {
          position: absolute; left: 92px; top: 110px; z-index: 24; width: 300px;
          padding: 18px 20px 16px; opacity: 0;
          box-shadow: 9px 10px 0 rgba(22,23,42,.18);
        }
        [data-composition-id="07-f7"] .f7-grate .mono { font-size: 12px; color: rgba(22,23,42,.65); margin-top: 6px; }
        [data-composition-id="07-f7"] .f7-grate .big {
          font-family: "Fraunces"; font-weight: 600; font-size: 44px; line-height: .96; letter-spacing: -.03em;
        }
      </style>

      <div id="root" data-composition-id="07-f7" data-width="1920" data-height="1080" data-duration="10.75">
        <div class="plate" id="f7-plate">
          <img src="../../assets/img/parmesan.jpg" alt="The whale-maid showers parmesan over the sandwich submarine" />
          <div class="paper-tint"></div>
        </div>

        <div class="f7-title" id="f7-title">
          <div class="f7-kicker kicker"><span class="line"></span>STEP 04 · CHEESE DECK</div>
          <div class="f7-parm display" id="f7-parm">Parmesan</div>
          <div class="f7-crispy display" id="f7-crispy">crispy skin</div>
        </div>

        <div class="f7-snowtag kicker" id="f7-snowtag">
          <span style="color:var(--red)">CHEESE SNOW</span>
          <div class="mono">VISIBILITY: DELICIOUS</div>
        </div>

        <div class="f7-grate card torn-b" id="f7-grate">
          <div class="kicker" style="color:var(--red)">GRATED</div>
          <div class="big">100%<br />parmigiano</div>
          <div class="mono">DO NOT INHALE</div>
        </div>

        <div class="f7-stamp1" id="f7-stamp1"><div class="stamp ink">Tasty dilemma</div></div>
        <div class="f7-stamp2" id="f7-stamp2"><div class="stamp solid-mustard">Carbohydrates</div></div>

        <div class="f7-cloud" id="f7-cloud"></div>

        <div class="vignette"></div>
        <div class="halftone"></div>
        <div class="grain"></div>
        <div class="edge-shadow"></div>

        <div class="f7-cover" id="f7-cover"></div>
      </div>

      <script src="../../assets/hf.js"></script>
      <script>
        HF.frame("07-f7", function (tl, root) {
          tl.fromTo("#f7-cover", { scale: 1 }, { scale: 0, duration: .62, ease: "power3.out" }, 0);

          HF.plate(tl, "#f7-plate img", { s0: 1.02, s1: 1.12, x0: 10, x1: -30, y0: 0, y1: 14, dur: 10.75, at: 0 });

          // main title
          tl.fromTo("#f7-parm", { opacity: 0, y: 80, scale: 1.06 }, { opacity: 1, y: 0, scale: 1, duration: .85, ease: "power4.out" }, .1);
          tl.fromTo("#f7-crispy", { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: .6, ease: "back.out(1.5)" }, .75);
          HF.reveal(tl, "#f7-snowtag", 1.6, { y: 12, dur: .5 });
          tl.fromTo("#f7-grate", { opacity: 0, x: -30, rotation: -2.5 }, { opacity: 1, x: 0, rotation: -1.3, duration: .55, ease: "power3.out" }, 2.0);

          // cheese flakes (deterministic)
          var flakes = 30;
          for (var i = 0; i < flakes; i++) {
            var f = document.createElement("div");
            f.className = "f7-flake";
            var s = 8 + HF.rand(i, 51) * 20;
            f.style.width = s + "px";
            f.style.height = s * (0.5 + HF.rand(i, 52) * 0.9) + "px";
            f.style.left = 6 + HF.rand(i, 53) * 90 + "%";
            f.style.top = -30 - HF.rand(i, 54) * 120 + "px";
            f.style.background = i % 4 === 0 ? "var(--mustard)" : "var(--cream)";
            f.style.borderRadius = i % 3 === 0 ? "50%" : "2px";
            f.style.opacity = 0;
            root.appendChild(f);
          }
          HF.all(".f7-flake").forEach(function (el, i) {
            var start = HF.rand(i, 55) * 5.2;
            var dur = 2.2 + HF.rand(i, 56) * 2.4;
            tl.fromTo(el, { y: 0, x: 0, rotation: 0, opacity: 0 }, { opacity: .88, duration: .25 }, start);
            tl.to(el, { y: 760 + HF.rand(i, 57) * 400, x: (HF.rand(i, 58) - .5) * 260, rotation: 360 * (1 + HF.rand(i, 59)), duration: dur, ease: "none" }, start);
            tl.to(el, { opacity: 0, duration: .4 }, start + dur - .4);
          });

          // punchline
          HF.stamp(tl, "#f7-stamp1 .stamp", 5.4, { rot: -3, dur: .42 });
          HF.stamp(tl, "#f7-stamp2 .stamp", 5.75, { rot: 2.5, dur: .42 });
          tl.to("#f7-title", { rotation: -.7, duration: .16, yoyo: true, repeat: 1 }, 5.4);

          // cheese sneeze
          tl.fromTo("#f7-cloud", { opacity: 0, scale: .94 }, { opacity: 1, scale: 1.04, duration: .55, ease: "power2.in" }, 10.05);
        });
      </script>
    </template>
  </body>
</html>
