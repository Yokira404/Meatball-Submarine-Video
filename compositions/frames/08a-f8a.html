<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>08 — Prime shipping</title></head>
  <body>
    <template>
      <link rel="stylesheet" href="../../assets/fonts.css" />
      <link rel="stylesheet" href="../../assets/base.css" />
      <style>
        [data-composition-id="08a-f8a"] { background: var(--paper); }
        [data-composition-id="08a-f8a"] .f8-cover {
          position: absolute; left: 50%; top: 50%; width: 2800px; height: 2800px;
          margin: -1400px 0 0 -1400px; border-radius: 50%; background: var(--paper);
          z-index: 96; transform: scale(1);
        }
        [data-composition-id="08a-f8a"] .f8-ship { position: absolute; inset: 0; z-index: 10; }
        [data-composition-id="08a-f8a"] .f8-ship .plate img { object-position: 72% 54%; }
        [data-composition-id="08a-f8a"] .f8-manifest {
          position: absolute; left: 78px; top: 86px; width: 760px; z-index: 26;
          padding: 26px 32px 28px; transform: rotate(-1.1deg);
        }
        [data-composition-id="08a-f8a"] .f8-manifest .head {
          display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--ink); padding-bottom: 9px; margin-bottom: 16px;
        }
        [data-composition-id="08a-f8a"] .f8-manifest .head .mono { font-size: 12px; }
        [data-composition-id="08a-f8a"] .f8-item {
          display: flex; align-items: flex-start; gap: 14px; margin-bottom: 12px;
          font-family: "Fraunces"; font-weight: 600; font-size: 36px; line-height: 1.02;
          letter-spacing: -.02em; opacity: 0;
        }
        [data-composition-id="08a-f8a"] .f8-chk {
          flex: 0 0 26px; width: 26px; height: 26px; margin-top: 5px; border: 2.5px solid var(--ink);
          position: relative; background: transparent;
        }
        [data-composition-id="08a-f8a"] .f8-chk i {
          position: absolute; left: 6px; top: 1px; width: 11px; height: 18px;
          border-right: 3px solid var(--red); border-bottom: 3px solid var(--red);
          transform: rotate(40deg) scale(.4); opacity: 0; display: block;
        }
        [data-composition-id="08a-f8a"] .f8-priority {
          position: absolute; right: 22px; bottom: 22px; z-index: 4; opacity: 0;
          font-family: "Space Mono"; font-weight: 700; font-size: 15px; letter-spacing: .12em;
          color: var(--red); border: 2px solid var(--red); padding: 6px 10px 4px; transform: rotate(-5deg);
        }
        [data-composition-id="08a-f8a"] .f8-radar { position: absolute; inset: 0; z-index: 20; opacity: 0; }
        [data-composition-id="08a-f8a"] .f8-radar .plate img { filter: saturate(1.05) contrast(1.04); }
        [data-composition-id="08a-f8a"] .f8-alertover {
          position: absolute; inset: 0; z-index: 15; pointer-events: none;
          background: radial-gradient(circle at 50% 50%, transparent 44%, rgba(212,70,47,.35) 100%);
          opacity: 0;
        }
        [data-composition-id="08a-f8a"] .f8-alarm {
          position: absolute; left: 50%; top: 0; width: 900px; height: 900px;
          margin-left: -450px; border-radius: 50%; z-index: 16; opacity: 0;
          background: repeating-radial-gradient(circle, transparent 0 90px, rgba(212,70,47,.12) 92px 94px);
        }
        [data-composition-id="08a-f8a"] .f8-beep {
          position: absolute; left: 84px; bottom: 78px; z-index: 30;
          font-size: 88px; color: var(--red); opacity: 0;
          text-shadow: 4px 4px 0 var(--paper);
        }
        [data-composition-id="08a-f8a"] .f8-what {
          position: absolute; left: 84px; bottom: 190px; z-index: 31;
        }
        [data-composition-id="08a-f8a"] .f8-what .stamp { font-size: 54px; padding: 16px 24px 13px; }
        [data-composition-id="08a-f8a"] .f8-sharkcount {
          position: absolute; right: 88px; top: 86px; z-index: 30; text-align: right;
          color: var(--ink); opacity: 0; background: rgba(242,231,209,.92);
          padding: 12px 16px 10px; box-shadow: 8px 8px 0 rgba(9,12,28,.28);
        }
        [data-composition-id="08a-f8a"] .f8-sharkcount .mono { font-size: 11px; color: rgba(22,23,42,.7); margin-top: 4px; }
        [data-composition-id="08a-f8a"] .f8-sharkcount .n {
          font-family: "Fraunces"; font-size: 90px; line-height: .76; color: var(--red);
        }
        [data-composition-id="08a-f8a"] .f8-barcode {
          margin-top: 18px; height: 42px; width: 70%;
          background: repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 7px, var(--ink) 7px 9px, transparent 9px 15px);
          opacity: .72;
        }
        [data-composition-id="08a-f8a"] .f8-warnring {
          position: absolute; z-index: 29; border: 3px solid var(--red); border-radius: 50%;
          opacity: 0;
        }
        [data-composition-id="08a-f8a"] .f8-redflash {
          position: absolute; inset: 0; background: var(--red); opacity: 0; z-index: 90;
        }
      </style>

      <div id="root" data-composition-id="08a-f8a" data-width="1920" data-height="1080" data-duration="9.55">
        <!-- shipping scene -->
        <div class="f8-ship" id="f8-ship">
          <div class="plate" id="f8-ship-plate">
            <img src="../../assets/img/parmesan.jpg" alt="Packing the submarine sandwich for delivery" />
            <div class="paper-tint"></div>
          </div>
          <div class="bubble-field" id="f8-bubbles"></div>

          <div class="f8-manifest card torn-a" id="f8-manifest">
            <div class="head kicker"><span>PACKING SLIP · 08</span><span class="mono">PRIORITY: YES</span></div>
            <div class="f8-item" id="f8-i1"><div class="f8-chk"><i></i></div><div>Season up the gluten-free submarine</div></div>
            <div class="f8-item" id="f8-i2"><div class="f8-chk"><i></i></div><div>Slather it in mascarpone cheese</div></div>
            <div class="f8-item" id="f8-i3"><div class="f8-chk"><i></i></div><div>Meatball seats in my submarine</div></div>
            <div class="f8-item" id="f8-i4"><div class="f8-chk"><i></i></div><div>Prime shipping under the sea</div></div>
            <div class="f8-barcode"></div>
            <div class="f8-priority" id="f8-priority">HANDLE WITH CARE</div>
          </div>

          <div class="f8-warnring" id="f8-ring1" style="left: 1210px; top: 270px; width: 120px; height: 120px;"></div>
          <div class="f8-warnring" id="f8-ring2" style="left: 1420px; top: 560px; width: 90px; height: 90px;"></div>
        </div>

        <!-- radar alert scene -->
        <div class="f8-radar" id="f8-radar">
          <div class="plate" id="f8-radar-plate">
            <img src="../../assets/img/radar.jpg" alt="The radar picks up three sharks" />
            <div class="paper-tint"></div>
          </div>
          <div class="f8-alarm" id="f8-alarm"></div>
          <div class="f8-alertover" id="f8-alertover"></div>
          <div class="f8-sharkcount" id="f8-sharkcount">
            <div class="mono">SONAR CONTACTS</div>
            <div class="n">03</div>
            <div class="mono">CLOSING IN</div>
          </div>
          <div class="f8-beep mono" id="f8-beep">BEEP BEEP BEEP</div>
          <div class="f8-what" id="f8-what"><div class="stamp solid">What's going on</div></div>
          <div class="vignette"></div>
          <div class="halftone"></div>
          <div class="grain"></div>
          <div class="edge-shadow"></div>
        </div>

        <div class="vignette"></div>
        <div class="halftone"></div>
        <div class="grain"></div>
        <div class="edge-shadow"></div>

        <div class="f8-redflash" id="f8-redflash"></div>
        <div class="f8-cover" id="f8-cover"></div>
      </div>

      <script src="../../assets/hf.js"></script>
      <script>
        HF.frame("08a-f8a", function (tl, root) {
          tl.fromTo("#f8-cover", { scale: 1 }, { scale: 0, duration: .6, ease: "power3.out" }, 0);

          HF.plate(tl, "#f8-ship-plate img", { s0: 1.06, s1: 1.12, x0: 28, x1: -20, y0: 0, y1: 16, dur: 9.05, at: 0 });
          HF.bubbles(tl, root, { count: 12, dur: 8, min: 7, max: 28, spread: 6, opacity: .6, z: 6 });

          tl.fromTo("#f8-manifest", { opacity: 0, x: -50, rotation: -3 }, { opacity: 1, x: 0, rotation: -1.1, duration: .6, ease: "power3.out" }, .15);
          [["#f8-i1", 0.05], ["#f8-i2", 3.2], ["#f8-i3", 6.41], ["#f8-i4", 9.02]].forEach(function (p) {
            var el = document.querySelector(p[0]), t = p[1];
            tl.fromTo(el, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .38, ease: "power2.out" }, t);
            tl.to(el, { color: "var(--red)", duration: .12 }, t + .25);
            tl.to(el.querySelector(".f8-chk i"), { opacity: 1, scale: 1, duration: .18, ease: "back.out(2)" }, t + .25);
          });
          HF.stamp(tl, "#f8-priority", 9.05, { rot: -5, dur: .3 });

          // hard cut to radar
          tl.to("#f8-ship", { opacity: 0, duration: .06, ease: "none" }, 9.55);
          tl.fromTo("#f8-radar", { opacity: 0 }, { opacity: 1, duration: .06, ease: "none" }, 9.55);
          HF.plate(tl, "#f8-radar-plate img", { s0: 1.05, s1: 1.14, x0: 24, x1: -30, y0: 0, y1: 14, dur: 3.7, at: 9.55 });

          HF.reveal(tl, "#f8-sharkcount", 9.45, { y: 18, dur: .5 });
          HF.stamp(tl, "#f8-warnring", 9.6, { rot: 0, dur: .35, stagger: .12 });
          tl.to("#f8-alarm", { opacity: 1, duration: .3 }, 9.7);
          tl.to("#f8-alarm", { rotation: 90, duration: 3.4, ease: "none" }, 9.7);
          tl.to("#f8-alertover", { opacity: .55, duration: .25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 9.8);

          tl.fromTo("#f8-beep", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .16, ease: "power1.out", repeat: 4, yoyo: true }, 11.44);
          tl.to("#f8-beep", { opacity: 1, duration: .1 }, 12.3);
          HF.stamp(tl, "#f8-what .stamp", 12.65, { rot: -2.5, dur: .35 });

          tl.fromTo("#f8-redflash", { opacity: 0 }, { opacity: .9, duration: .2, ease: "power2.in" }, 13.34);
        });
      </script>
    </template>
  </body>
</html>
